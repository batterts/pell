org.gradle.jvmargs=-Xmx4g
kotlin.stdlib.default.dependency=false

# Pin the JDK to Temurin HotSpot. The Kotlin compiler that ships
# with the IntelliJ Platform Gradle plugin can't read the modular
# system images from IBM Semeru OpenJ9 (it hits a
#   NoClassDefFoundError: javaslang/collection/HashMap
# during module-info scanning). Temurin works cleanly.
#
# Adjust the path if your Temurin install is in a different
# location: `/usr/libexec/java_home -v 21` prints the system-
# selected JDK path.
org.gradle.java.installations.paths=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home
org.gradle.java.installations.fromEnv=JAVA_HOME
