title: pell
description: A statically-typed language that compiles to Oracle PL/SQL 19c / 23ai
remote_theme: just-the-docs/just-the-docs

# GitHub Pages whitelisted plugins (see pages.github.com/versions for the
# current allowlist). `jekyll-remote-theme` is required by `remote_theme:`
# above; `jekyll-seo-tag` adds proper Open Graph / Twitter Card meta tags.
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

url: https://batterts.github.io
baseurl: /pell

# Theme settings
color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 4
  preview_words_after: 4
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
heading_anchors: true

# Footer / links shown at top-right
aux_links:
  "View on GitHub":
    - "https://github.com/batterts/pell"
aux_links_new_tab: true

# Repository button + edit-this-page links
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/batterts/pell"
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "tree"

# Don't process node_modules, venvs, etc. if they happen to land here
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .venv

# Mermaid is enabled in just-the-docs ≥0.5; useful if we ever embed graphs
mermaid:
  version: "10.6.0"

# Pell uses syntax highlighting for both pell and SQL; rouge supports SQL
# out of the box. Pell snippets render as plain text — acceptable for v0.
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Callout boxes used in the tutorial
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
